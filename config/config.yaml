dataset:

  repository: microsoft/taskbench

  # Options
  tasks: dailylifeapis
  tools:
    - dailylifeapis
    - multimedia
    - huggingface

  # 2    = quick validation
  # 500  = configuration used in the paper
  # null = all available benchmark tests
  max_tasks: 2

  tasks_directory: datasets/tasks
  tools_directory: datasets/tools


agent:
  models:
    # - qwen2.5:0.5b-instruct-q4_K_M
    # - qwen2.5:1.5b-instruct-q4_K_M
    # - qwen2.5:3b-instruct-q4_K_M
    - qwen2.5:7b-instruct-q4_K_M
    # - qwen3.5:0.8b
    # - qwen3.5:2b
    # - qwen3.5:4b
    # - gemma4:e2b
    # - gemma4:e4b
    # - gemma4:12b
    # - gpt-oss:20b
    # - devstral:24b

  base_url: http://localhost:11434/v1
  api_key: ollama
  n_ctx: 8192
  temperature: 0.0
  max_steps: 10
  max_tokens: 1024


# Reduction combinations to evaluate.
#
# 0 = baseline
# 1 = single reductions
# 2 = pairwise reduction combinations
# 3 = three-way reduction combinations
# 4 = all four reductions combined
#
# Note:
# - Parameter combinations are generated exhaustively from the enabled
#   reductions and enabled parameter values.
# - To restrict the experiment space, disable reductions, comment out
#   parameter values, or comment out models.
combination_sizes: [0,1]


reductions:
  semantic: true
  category: true
  concept: true
  schema: true

reduction_parameters:
  top_k:
    # - 3
    - 5
    # - 10
    # - 20
  n_clusters:
    # - 3
    - 5
    # - 10


results:
  directory: results
